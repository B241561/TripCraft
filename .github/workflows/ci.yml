name: TripCraft CI

on:
  push:
    branches:
      - main
      - develop
      - ci-pipeline

  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Run frontend tests
        working-directory: client
        run: npm test

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Run backend tests
        working-directory: server
        run: npm test

      - name: Verify Node.js and npm versions
        run: |
          node --version
          npm --version

  publish-images:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short git SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/skit-devops-2026/tripcraft-backend:${{ steps.vars.outputs.sha_short }}
            ghcr.io/skit-devops-2026/tripcraft-backend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/skit-devops-2026/DevOps-24ESKCS056

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ghcr.io/skit-devops-2026/tripcraft-frontend:${{ steps.vars.outputs.sha_short }}
            ghcr.io/skit-devops-2026/tripcraft-frontend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/skit-devops-2026/DevOps-24ESKCS056
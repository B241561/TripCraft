apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: tripcraft-backend
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: tripcraft-frontend
spec:
  type: ClusterIP
  selector:
    app: tripcraft-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  type: ClusterIP
  selector:
    app: tripcraft-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo

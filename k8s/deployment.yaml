apiVersion: apps/v1
kind: Deployment
metadata:
  name: tripcraft-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tripcraft-backend
  template:
    metadata:
      labels:
        app: tripcraft-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/skit-devops-2026/tripcraft-backend:20261016-e45f1c4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: tripcraft-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tripcraft-secrets
                  key: JWT_SECRET
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tripcraft-secrets
                  key: GROQ_API_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tripcraft-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tripcraft-frontend
  template:
    metadata:
      labels:
        app: tripcraft-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/skit-devops-2026/tripcraft-frontend:20261016-e45f1c4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
